{% extends 'base.html' %}

{% block title %}Iniciar Sesión - FaCyT{% endblock %}

{% block content %}
<article style="max-width: 500px; margin: 0 auto;">
    <header>
        <h3 style="text-align: center;">Acceso al Sistema 🔐</h3>
    </header>
    
    <form action="/login" method="POST">
        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@uc.edu.ve" required>

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>

        <input type="submit" value="Ingresar" class="primary">
    </form>
    
    <footer style="text-align: center; margin-top: 1rem;">
        <p>¿No tienes una cuenta? <a href="/registro">Regístrate aquí</a></p>
    </footer>
</article>
{% endblock %}
